[package]
name = "kglass"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
description = "Kubeglass: a read-only terminal viewer for Kubernetes clusters"
readme = "README.md"
repository = "https://github.com/mithatkonuk/kglass"
keywords = ["kubernetes", "tui", "kubectl", "terminal", "ratatui"]
categories = ["command-line-utilities"]

[[bin]]
name = "kglass"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.2"
clap = { version = "4.6", features = ["derive"] }
color-eyre = "0.6.5"
unicode-width = "0.2.3"
kube = { version = "4.2", default-features = false, features = ["client", "config", "rustls-tls", "ring"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
serde = "1"
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http = "1"
tokio = { version = "1.47", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"
